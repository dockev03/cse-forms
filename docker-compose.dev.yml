# Environnement de développement local uniquement : PostgreSQL.
# Usage : cp .env.example .env, renseigner les valeurs, puis
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB absent}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER absent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD absent}
    # Exposé uniquement sur la boucle locale du poste de développement.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
